# 기본적으로 OP만 사용합니다. false로 바꾸면 adminlite.* 개별 권한으로 제어합니다.
op-only: true

# 화이트리스트 등록/해제 기록에 사용할 시간대. 저장된 과거 기록의 시간대는 유지합니다.
whitelist:
  time-zone: Asia/Seoul

features:
  gui: true
  player-info: true
  warn: true
  mute: true
  kick: true
  ban: true
  freeze: true
  spectate: true
  vanish: true
  # 관리자 본인의 탭 목록/머리 위 이름 숨김. 개별 ON/OFF는 /admin visibility에서 설정합니다.
  visibility: true
  teleport: true
  inventory: true
  offline-inventory: true
  broadcast: true
  chat: true

# 채팅 관리용 최근 메시지는 메모리에만 보관합니다. 제재 이력은 저장하지 않습니다.
chat-log-size: 50
clearchat-lines: 120

# 뮤트 상태에서 차단할 채팅 명령어. 사용 중인 귓속말 플러그인의 별칭도 추가할 수 있습니다.
# /report 및 /reportchat은 상담을 위해 기본적으로 허용합니다.
mute-blocked-commands: [msg, w, tell, whisper, me, say, teammsg, tm]

general-prefix: '&7[&bAdminLite&7]&f '
no-permission: '&c권한이 없습니다.'
player-only: '&c플레이어만 사용할 수 있습니다.'
player-not-found: '&c저장된 플레이어를 찾을 수 없습니다. 정확한 닉네임 또는 UUID를 입력하세요.'
feature-disabled: '&c설정에서 비활성화된 기능입니다.'
operation-failed: '&c작업을 완료하지 못했습니다. 서버 콘솔의 오류를 확인하세요.'
reload-message: '&a설정을 다시 불러왔습니다.'
