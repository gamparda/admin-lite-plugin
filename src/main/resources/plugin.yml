name: AdminLite
version: 2.3.0
main: kr.openclaw.adminlite.AdminLitePlugin
api-version: '26.3'
author: OpenClaw
description: Personal administration tools with online and offline inventory editing.
softdepend: [InvSee, BerryNames, packetevents]
commands:
  whitelist:
    description: Manage whitelist registrations with a required CHZZK nickname.
    permission: adminlite.whitelist
  admin:
    description: Open the administration menu or use administration commands.
    aliases: [adm]
    permission: adminlite.use
  invsee:
    description: View or edit online and offline player inventories.
    permission: adminlite.invsee
  endersee:
    description: View or edit online and offline ender chests.
    aliases: [ecsee]
    permission: adminlite.invsee
permissions:
  adminlite.whitelist:
    default: op
  adminlite.use:
    default: op
  adminlite.gui:
    default: op
  adminlite.info:
    default: op
  adminlite.invsee:
    default: op
  adminlite.invsee.edit:
    default: op
  adminlite.warn:
    default: op
  adminlite.freeze:
    default: op
  adminlite.mute:
    default: op
  adminlite.kick:
    default: op
  adminlite.ban:
    default: op
  adminlite.spectate:
    default: op
  adminlite.teleport:
    default: op
  adminlite.vanish:
    default: op
  adminlite.visibility:
    default: op
  adminlite.see-hidden:
    default: op
  adminlite.broadcast:
    default: op
  adminlite.chatlog:
    default: op
  adminlite.deletechat:
    default: op
  adminlite.clearchat:
    default: op
  adminlite.reload:
    default: op
